
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDDA-MD | WhatsApp Bot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080808;
            color: white;
            min-height: 100vh;
        }

        .welcome {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            background:
                radial-gradient(circle at center, #350008 0%, #080808 65%);
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            color: white;
            text-shadow: 0 0 20px #ff2638;
        }

        .logo span {
            color: #ff2638;
        }

        .welcome p {
            color: #aaa;
            margin-top: 15px;
            font-size: 14px;
            letter-spacing: 2px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .connect-btn {
            margin-top: 40px;
            padding: 16px 42px;
            background: #ff2638;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 0 25px #ff263855;
        }

        .connect-btn:hover {
            background: #d90019;
            transform: scale(1.05);
        }

        .connection {
            display: none;
            min-height: 100vh;
            padding: 35px 18px;
            text-align: center;
        }

        .header {
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header span {
            color: #ff2638;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            background: #191919;
            border: 1px solid #333;
            border-radius: 30px;
            color: #ff5967;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .card {
            max-width: 430px;
            width: 100%;
            margin: 15px auto;
            padding: 25px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;
        }

        .card h3 {
            color: #ff2638;
            margin-bottom: 18px;
        }

        .qr-area {
            width: 220px;
            height: 220px;
            margin: auto;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .qr-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-placeholder {
            color: #555;
            font-size: 13px;
            padding: 15px;
        }

        .pairing-code {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 5px;
            color: white;
            padding: 18px;
            background: #080808;
            border: 1px dashed #ff2638;
            border-radius: 7px;
            margin-top: 10px;
            min-height: 65px;
        }

        .phone-input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #080808;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .phone-input:focus {
            border-color: #ff2638;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #ff2638;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .action-btn:hover {
            background: #d90019;
        }

        .back-btn {
            margin-top: 25px;
            background: transparent;
            color: #aaa;
            font-size: 13px;
        }

        .back-btn:hover {
            color: #ff2638;
        }

        .note {
            color: #666;
            font-size: 12px;
            margin-top: 15px;
            line-height: 1.6;
        }

        @media (max-width: 400px) {
            .logo {
                font-size: 32px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- WELCOME PAGE -->
    <section class="welcome" id="welcomePage">
        <div class="logo">SUDDA<span>-MD</span></div>

        <p>ADVANCED WHATSAPP BOT</p>

        <button class="connect-btn" onclick="openConnection()">
            CONNECT BOT
        </button>
    </section>


    <!-- CONNECTION PAGE -->
    <section class="connection" id="connectionPage">

        <div class="header">
            SUDDA<span>-MD</span>
        </div>

        <div class="subtitle">
            CONNECT YOUR WHATSAPP ACCOUNT
        </div>

        <div class="status" id="status">
            ● WAITING FOR CONNECTION
        </div>

        <!-- QR CODE -->
        <div class="card">
            <h3>SCAN QR CODE</h3>

            <div class="qr-area" id="qrArea">
                <div class="qr-placeholder">
                    QR CODE WILL APPEAR HERE
                </div>
            </div>

            <p class="note">
                Open WhatsApp → Linked Devices → Link a Device
            </p>
        </div>

        <!-- PAIRING CODE -->
        <div class="card">
            <h3>PAIRING CODE</h3>

            <input
                type="tel"
                class="phone-input"
                id="phoneNumber"
                placeholder="Enter WhatsApp number with country code"
            >

            <button class="action-btn" onclick="generatePairingCode()">
                GENERATE PAIRING CODE
            </button>

            <div class="pairing-code" id="pairingCode">
                --------
            </div>

            <p class="note">
                Enter your number with country code.
            </p>
        </div>

        <button class="back-btn" onclick="goBack()">
            ← BACK TO HOME
        </button>

    </section>


    <script>
        const welcomePage = document.getElementById("welcomePage");
        const connectionPage = document.getElementById("connectionPage");

        let statusTimer = null;

        function openConnection() {
            welcomePage.style.display = "none";
            connectionPage.style.display = "block";

            loadConnectionStatus();

            if (!statusTimer) {
                statusTimer = setInterval(loadConnectionStatus, 3000);
            }
        }

        function goBack() {
            connectionPage.style.display = "none";
            welcomePage.style.display = "flex";

            if (statusTimer) {
                clearInterval(statusTimer);
                statusTimer = null;
            }
        }

        async function loadConnectionStatus() {
            try {
                const response = await fetch("/api/connection", {
                    cache: "no-store"
                });

                if (!response.ok) return;

                const data = await response.json();

                const status = document.getElementById("status");
                const qrArea = document.getElementById("qrArea");
                const pairingCode = document.getElementById("pairingCode");

                if (data.status === "CONNECTED") {
                    status.textContent = "● WHATSAPP CONNECTED";
                    status.style.color = "#35df83";
                } else {
                    status.textContent = "● WAITING FOR CONNECTION";
                    status.style.color = "#ff5967";
                }

                if (data.qr) {
                    qrArea.innerHTML = "";

                    const img = document.createElement("img");

                    img.src = data.qr.startsWith("data:")
                        ? data.qr
                        : "data:image/png;base64," + data.qr;

                    img.alt = "WhatsApp QR Code";
                    qrArea.appendChild(img);
                }

                if (data.pairingCode) {
                    pairingCode.textContent = data.pairingCode;
                }

            } catch (error) {
                console.log("Connection status unavailable:", error);
            }
        }

        async function generatePairingCode() {
            const phone = document.getElementById("phoneNumber").value.trim();
            const pairingCode = document.getElementById("pairingCode");

            if (!phone) {
                alert("Please enter your WhatsApp number.");
                return;
            }

            pairingCode.textContent = "LOADING...";

            try {
                const response = await fetch("/api/connect/pairing", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        phone: phone
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Pairing code request failed");
                }

                if (data.pairingCode) {
                    pairingCode.textContent = data.pairingCode;
                }

            } catch (error) {
                pairingCode.textContent = "ERROR";
                alert(error.message);
            }
        }
    </script>

</body>
</html>
